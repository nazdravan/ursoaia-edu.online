[project]
name = "ursoaia-edu-online"
version = "0.1.0"
description = "MkDocs site for the Ursoaia computer-science circle (Arduino, ESP32, LoPy, Raspberry Pi)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mkdocs>=1.6.1",
    "mkdocs-static-i18n>=1.3.1",
    "pillow>=11.0.0",
    "pygments>=2.20.0",
    "pymdown-extensions>=10.21.2",
]

[project.optional-dependencies]
diagrams = ["playwright>=1.47"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
dev = "ursoaia_edu_online:serve"
serve = "ursoaia_edu_online:serve"
build = "ursoaia_edu_online:build"
build-css = "ursoaia_edu_online:build_css"
build-images = "ursoaia_edu_online:build_images"
build-diagrams = "ursoaia_edu_online:build_diagrams"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ursoaia_edu_online"]
